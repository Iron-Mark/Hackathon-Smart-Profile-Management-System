name: Trusted PR Lifecycle

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  queue-trusted-pr:
    name: queue-trusted-pr
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ready and queue trusted pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          read -r state draft author association head_owner current_head_sha < <(
            gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.state, (.draft | tostring), .user.login, .author_association, .head.repo.owner.login, .head.sha] | @tsv'
          )

          trusted=false
          case "${association}" in
            OWNER|MEMBER|COLLABORATOR) trusted=true ;;
          esac
          case "${head_owner}" in
            "${REPOSITORY_OWNER}"|Iron-Mark|MarkSiazon|MarkS-Trampettimg) trusted=true ;;
          esac
          case "${author}" in
            "dependabot[bot]"|"imgbot[bot]") trusted=true ;;
          esac

          if [[ "${state}" != "open" || "${trusted}" != "true" || "${current_head_sha}" != "${RUN_HEAD_SHA}" ]]; then
            echo "PR #${PR_NUMBER} is closed, untrusted, or has moved since this CI run; leaving it manual."
            exit 0
          fi

          pr_url="https://github.com/${REPOSITORY}/pull/${PR_NUMBER}"
          if [[ "${draft}" == "true" ]]; then
            gh pr ready "${pr_url}"
          fi
          gh pr merge "${pr_url}" --auto --squash
